{% extends 'shop/basic.html' %}
{% block title%} Checkout - My Awesome Cart{% endblock %}

{% block body %}
<div class="container">
    <div class="col my-4">
        <h2>Step 1 - My Awesome Cart Express Checkout - Review Your Cart Items</h2>
        
        <div class="my-4">
            <ul class="list-group" id="items"></ul>
        </div>
    </div>

    <div class="col my-4">
        <h2>Step 2 - Enter Address & Other Details:</h2>

        <form method="post" action="/shop/checkout/">
            {% csrf_token %}
            <input type="hidden" name="itemsJson" id="itemsJson">

            <div class="row">
                <div class="form-group col-md-6">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Name">
                </div>

                <div class="form-group col-md-6">
                    <label>Email</label>
                    <input type="email" class="form-control" name="email" placeholder="Email">
                </div>
            </div>

            <div class="form-group mt-2">
                <label>Address</label>
                <input type="text" class="form-control" name="address1" placeholder="1234 Main St">
            </div>

            <div class="form-group mt-2">
                <label>Address line 2</label>
                <input type="text" class="form-control" name="address2" placeholder="Apartment, studio, or floor">
            </div>

            <div class="row mt-2">
                <div class="form-group col-md-6">
                    <label>City</label>
                    <input type="text" class="form-control" name="city">
                </div>

                <div class="form-group col-md-4">
                    <label>State</label>
                    <input type="text" class="form-control" name="state" placeholder="Enter State">
                </div>

                <div class="form-group col-md-2">
                    <label>Zip</label>
                    <input type="text" class="form-control" name="zip_code">
                </div>
            </div>

            <div class="form-group mt-2">
                <label>Phone Number</label>
                <input type="tel" class="form-control" name="phone">
            </div>

            <button type="submit" class="btn btn-primary mt-3">Place Order</button>
        </form>
    </div>
</div>
{% endblock %}


{% block js %}
<script>

// Get cart from localStorage
let cart = localStorage.getItem('cart') 
            ? JSON.parse(localStorage.getItem('cart')) 
            : {};

console.log(cart);

let sum = 0;

// If cart is empty
if (Object.keys(cart).length === 0) {
    document.getElementById('items').innerHTML = `
        <p class="text-danger">
            Your cart is empty, please add some items before checking out!
        </p>`;
} 
else {
    let itemsList = document.getElementById('items');

    for (let item in cart) {

    let name, qty;

    // Case 1: Array format [qty, name, price]
    if (Array.isArray(cart[item])) {
        qty = cart[item][0];
        name = cart[item][1];
    } 
    
    // Case 2: Object format {name: "", qty: ""}
    else if (typeof cart[item] === "object") {
        qty = cart[item].qty;
        name = cart[item].name;
    }

    // Fallback (avoid undefined)
    if (!name) name = "Item";
    if (!qty) qty = 0;

    sum += qty;

    document.getElementById('items').innerHTML += `
    <li class="list-group-item d-flex justify-content-between align-items-center">
        ${name}
        <span class="badge bg-primary rounded-pill">${qty}</span>
    </li>`;
}
}

// Update cart count safely
let cartElement = document.getElementById('cart');
if (cartElement) {
    cartElement.innerHTML = sum;
}

// Store cart JSON in hidden input
document.getElementById('itemsJson').value = JSON.stringify(cart);

// Order success message
{% if thank %}
alert("Thanks for ordering! Your order id is {{id}}. Use it to track your order.");
localStorage.clear();
window.location.href = "/shop";
{% endif %}

</script>
{% endblock %}
