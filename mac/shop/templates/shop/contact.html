{% extends 'shop/basic.html' %}

{% block title %}Contact Us - My Awesome Cart{% endblock %}

{% block body %}
<div class="container my-3">
    <h3>Contact Us</h3>

    <form action="/shop/contact/" method="post">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter Your Name" required>
        </div>

        <div class="form-group mb-3">
            <label for="email">Email</label>  
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter Your Email" required>
        </div>

        <div class="form-group mb-3">
            <label for="phone">Phone</label> 
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter Your Phone Number" required>
        </div>

        <div class="form-group mb-3">
            <label for="desc">How May We Help You?</label>
            <textarea class="form-control" id="desc" name="desc" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</div>

<!-- Map Section -->
<div class="container my-4">
    <h5>Our Location</h5>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3430.330428913247!2d76.68852197459894!3d30.709109886775703!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390fee5655555555%3A0x126706be8e96bfa4!2sAron%20Web%20Solutions%20Pvt.%20Ltd.!5e0!3m2!1sen!2sin!4v1773926076293!5m2!1sen!2sin" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

{% endblock %}
