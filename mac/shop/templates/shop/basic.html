<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <title>{% block title %}{% endblock %}</title>

    <style>
      {% block css %}{% endblock %}
    </style>
  </head>

  <body>
    <!--  NAVBAR  -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/shop">My Awesome Cart</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="/shop">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/shop/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/shop/contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/shop/tracker">Tracker</a>
            </li>

            <!-- CATEGORY -->
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                Categories
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/shop/category/Electronics/">Electronics</a></li>
                <li><a class="dropdown-item" href="/shop/category/Shoes/">Shoes</a></li>
                <li><a class="dropdown-item" href="/shop/category/Wrist Watch/">Watches</a></li>
                <li><a class="dropdown-item" href="/shop/category/mobile/">Mobiles</a></li>
              </ul>
            </li>
          </ul>

          <!-- SEARCH -->
          <form class="d-flex">
            <input class="form-control me-2" type="search" placeholder="Search" />
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>

          <!-- CART BUTTON -->
          <button
            type="button"
            class="btn btn-secondary mx-2"
            id="popcart"
            data-bs-container="body"
            data-bs-toggle="popover"
            data-bs-placement="bottom"
            data-bs-html="true"
          >
            Cart(<span id="cart">0</span>)
          </button>
        </div>
      </div>
    </nav>

    <!-- MESSAGES -->
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show my-0" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <!-- BODY -->
    {% block body %}{% endblock %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- GLOBAL CART SCRIPT  -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {

        //LOAD CART
        let cart = localStorage.getItem('cart')
          ? JSON.parse(localStorage.getItem('cart'))
          : {};

        //UPDATE COUNT 
        function updateCartDisplay() {
          let totalQty = 0;

          for (let item in cart) {
            totalQty += cart[item].qty;
          }

          let cartCount = document.getElementById('cart');
          if (cartCount) {
            cartCount.innerHTML = totalQty;
          }
        }

        //UPDATE POPOVER 
        function updatePopover() {
          let popStr = "<h5>Cart Items</h5><ul>";

          for (let item in cart) {
            popStr += `
              <li>
                <img src="${cart[item].img}" width="40">
                ${cart[item].name} (Qty: ${cart[item].qty})
              </li>
            `;
          }

          popStr += "</ul>";

          let popcart = document.getElementById('popcart');
          if (!popcart) return;

          let old = bootstrap.Popover.getInstance(popcart);
          if (old) old.dispose();

          new bootstrap.Popover(popcart, {
            html: true,
            content: popStr
          });
        }

        // INIT
        updateCartDisplay();
        updatePopover();

      });
    </script>

    <!-- PAGE JS -->
    {% block js %}{% endblock %}

  </body>
</html>
