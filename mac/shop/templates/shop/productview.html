{% extends 'shop/basic.html' %}

{% block title %} {{product.product_name}} - My Awesome Cart {% endblock %}

{% block body %}
<div class="container my-5">

    <div class="row align-items-center">

        <!-- Product Image -->
        <div class="col-md-5 text-center">
            <img src="/media/{{product.image}}" 
                 class="img-fluid rounded shadow"
                 style="max-height: 350px;">
        </div>

        <!-- Product Details -->
        <div class="col-md-7">

            <h3 class="mb-3">{{product.product_name}}</h3>

            <h4 class="text-success mb-3">
                ₹{{product.price}}
            </h4>

            <p class="text-muted">
                {{product.desc}}
            </p>

            <!-- Buttons -->
            <div class="mt-4">

                <button class="btn btn-success me-2">
                    Buy Now
                </button>

                <!-- FIXED BUTTON WITH DATA -->
                <button id="pr{{product.id}}" 
                        class="btn btn-primary cart"
                        data-name="{{product.product_name}}"
                        data-img="/media/{{product.image}}">
                    Add To Cart
                </button>

            </div>

        </div>

    </div>

</div>
{% endblock %}


{% block js %}
<script>

document.addEventListener("DOMContentLoaded", function () {

    let cart = localStorage.getItem('cart') 
        ? JSON.parse(localStorage.getItem('cart')) 
        : {};

    //ADD TO CART 
    document.querySelectorAll('.cart').forEach(button => {

        button.addEventListener('click', function () {

            let id = this.id;
            let name = this.dataset.name;
            let img = this.dataset.img;

            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                cart[id] = {
                    qty: 1,
                    name: name,
                    img: img
                };
            }

            updateCart();
        });
    });


    // UPDATE CART 
    function updateCart() {

        localStorage.setItem('cart', JSON.stringify(cart));

        //  TOTAL COUNT FIX
        let totalQty = 0;
        for (let item in cart) {
            totalQty += cart[item].qty;
        }

        let cartCount = document.getElementById('cart');
        if (cartCount) {
            cartCount.innerHTML = totalQty;
        }

        updatePopover();
    }


    // PLUS / MINUS 
    document.addEventListener('click', function (e) {

        if (e.target.classList.contains('minus')) {

            let id = e.target.id.replace('minus', '');

            if (cart[id].qty > 1) {
                cart[id].qty -= 1;
            } else {
                delete cart[id];
                location.reload();
            }

            updateCart();
        }

        if (e.target.classList.contains('plus')) {

            let id = e.target.id.replace('plus', '');
            cart[id].qty += 1;

            updateCart();
        }
    });


    //  POPOVER 
    function updatePopover() {

        let popStr = "<h5>Cart Items</h5><ul>";

        for (let item in cart) {

            popStr += `
                <li>
                    <img src="${cart[item].img}" width="40">
                    ${cart[item].name} (Qty: ${cart[item].qty})
                </li>
            `;
        }

        popStr += "</ul>";

        let popcart = document.getElementById('popcart');
        if (!popcart) return;

        let old = bootstrap.Popover.getInstance(popcart);
        if (old) old.dispose();

        new bootstrap.Popover(popcart, {
            html: true,
            content: popStr
        });
    }

    // INIT 
    updateCart();

});

</script>
{% endblock %}
